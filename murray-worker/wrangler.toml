# Murray: the 705 BRBR shopping assistant (chat API for the website's chat bubble).
# Deployed by .github/workflows/deploy-murray.yml. The Anthropic key is a Worker secret (ANTHROPIC_API_KEY).
name = "brbr-murray"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
STORE_URL = "https://705brbr.org"
LOTTERY_API = "https://brbr-lottery.munatsialwyn26.workers.dev"
ALLOWED_ORIGINS = "https://705brbr.org,https://www.705brbr.org,https://7e36ef-2.myshopify.com"
MODEL = "claude-haiku-5-5"
GROQ_MODEL = "openai/gpt-oss-120b"
# Website sign-up (POST /signup): creates customers through the "705 BRBR Account Extras" app.
# Its client secret is the Worker secret SIGNUP_CLIENT_SECRET (GitHub secret ACCOUNT_APP_CLIENT_SECRET).
SHOPIFY_STORE_DOMAIN = "7e36ef-2.myshopify.com"
SIGNUP_CLIENT_ID = "1ffd4218b4ef1986b7f6f4a3cf74b89a"

# Direct link to the 705 BRBR lottery Worker (live NY Lottery results). Workers on the same account can't
# always call each other over workers.dev, so this uses a service binding.
[[services]]
binding = "LOTTERY"
service = "brbr-lottery"
