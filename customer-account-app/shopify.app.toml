# 705 BRBR Account Extras: adds a branded block to the customer account Orders page.
# App created in the Dev Dashboard (705 BRBR org).
client_id = "1ffd4218b4ef1986b7f6f4a3cf74b89a"
name = "705 BRBR Account Extras"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# unauthenticated_read_product_listings: the account block reads product names, photos and prices for "Popular right now".
# read_customers, write_customers: the website "Sign up" page creates the customer (name, email, phone, birth date,
# gender, default address) through the brbr-murray Worker's /signup endpoint.
scopes = "unauthenticated_read_product_listings,read_customers,write_customers"

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[webhooks]
api_version = "2026-10"
