name: Deploy Murray (chat assistant)

# Deploys murray-worker/ (the API behind the "Murray" chat bubble on 705brbr.org) to Cloudflare Workers.
# Runs when that folder changes on main, or manually from the Actions tab.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > Create Token > "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard > Workers & Pages (right-hand side: Account ID)
#   ANTHROPIC_API_KEY      console.anthropic.com > API Keys
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'murray-worker/**'
      - '.github/workflows/deploy-murray.yml'

concurrency:
  group: deploy-murray
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run tests
        working-directory: murray-worker
        run: npm test

      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Murray not deployed. Add these repository secrets:$missing"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Workers
        if: env.SKIP_DEPLOY != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: murray-worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Health check
        if: env.SKIP_DEPLOY != '1'
        run: |
          sleep 5
          curl -fsS https://brbr-murray.munatsialwyn26.workers.dev/health || echo "::warning::Health check failed; check the Worker in the Cloudflare dashboard."
