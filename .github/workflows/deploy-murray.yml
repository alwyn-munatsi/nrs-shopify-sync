name: Deploy Murray (chat assistant)

# Deploys murray-worker/ (the API behind the "Murray" chat bubble on 705brbr.org) to Cloudflare Workers.
# Runs when that folder changes on main, or manually from the Actions tab.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > Create Token > "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard > Workers & Pages (right-hand side: Account ID)
#   GROQ_API_KEY           console.groq.com > API Keys (used when present)
#   ANTHROPIC_API_KEY      console.anthropic.com > API Keys (used if there is no Groq key)
#   SHOPIFY_ADMIN_ACCESS_TOKEN  (already set for the NRS sync) used by the website sign-up (/signup)
# At least one of GROQ_API_KEY / ANTHROPIC_API_KEY is needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'murray-worker/**'
      - '.github/workflows/deploy-murray.yml'

concurrency:
  group: deploy-murray
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run tests
        working-directory: murray-worker
        run: npm test

      - name: Check secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC$GROQ" ] || missing="$missing GROQ_API_KEY(or ANTHROPIC_API_KEY)"
          if [ -n "$missing" ]; then
            echo "::warning::Murray not deployed. Add these repository secrets:$missing"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Workers
        if: env.SKIP_DEPLOY != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: murray-worker
          command: deploy

      - name: Set model API keys as Worker secrets
        if: env.SKIP_DEPLOY != '1'
        working-directory: murray-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNUP_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
        run: |
          for name in GROQ_API_KEY ANTHROPIC_API_KEY SIGNUP_ADMIN_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            fi
          done

      - name: Health check
        if: env.SKIP_DEPLOY != '1'
        run: |
          sleep 5
          curl -fsS https://brbr-murray.munatsialwyn26.workers.dev/health || echo "::warning::Health check failed; check the Worker in the Cloudflare dashboard."
