name: NRS Inventory Sync

on:
  schedule:
    # Hourly. Minute 17 instead of 0: GitHub often delays or drops runs scheduled on the hour.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = report only, live = write to Shopify'
        type: choice
        options: [dry-run, live]
        default: dry-run
      max_new_products:
        description: 'Most new products to create in this run'
        default: '500'
      excluded_action:
        description: 'Nicotine/restricted products still on Shopify: archive (restorable) or delete (PERMANENT)'
        type: choice
        options: [archive, delete]
        default: archive

# Never run two syncs at the same time.
concurrency:
  group: nrs-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # for the "new products" notification issue

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Execute Inventory Synchronization
        env:
          # Manual runs use the mode picked in the form. Scheduled runs use the repository
          # variable SYNC_MODE (Settings > Secrets and variables > Actions > Variables) and
          # stay in dry-run until that variable is set to "live".
          SYNC_MODE: ${{ github.event.inputs.mode || vars.SYNC_MODE || 'dry-run' }}
          MAX_NEW_PRODUCTS_PER_RUN: ${{ github.event.inputs.max_new_products || vars.MAX_NEW_PRODUCTS_PER_RUN || '500' }}
          # New products go live (ACTIVE, published to the Online Store). Set the variable to DRAFT to review them first.
          NEW_PRODUCT_STATUS: ${{ vars.NEW_PRODUCT_STATUS || 'ACTIVE' }}
          # Nicotine products are never synced; ones already on Shopify are archived. Misfiled nicotine items are
          # caught by name (EXCLUDE_NAME_PATTERN in sync_inventory.py).
          EXCLUDE_DEPARTMENTS: ${{ vars.EXCLUDE_DEPARTMENTS || 'Vaporizers,Tobacco' }}
          # Scheduled runs only archive. Permanent deletion needs a manual run with excluded_action = delete.
          EXCLUDED_ACTION: ${{ github.event.inputs.excluded_action || 'archive' }}
          # Shopify calls go through the Worker: the app's IP allowlist accepts Cloudflare, not GitHub's runners.
          NRS_PROXY_URL: ${{ vars.NRS_PROXY_URL || 'https://brbr-murray.munatsialwyn26.workers.dev/nrs/graphql' }}
          SYNC_PRICES: ${{ vars.SYNC_PRICES || 'true' }}
          # Online price = register price + this percent.
          PRICE_MARKUP_PERCENT: ${{ vars.PRICE_MARKUP_PERCENT || '20' }}
          # Stock is off until the store's NRS counts are reliable.
          SYNC_STOCK: ${{ vars.SYNC_STOCK || 'false' }}
          # New products include register items with 0 or negative stock (set to 'false' to skip them).
          INCLUDE_ZERO_STOCK: ${{ vars.INCLUDE_ZERO_STOCK || 'true' }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          # The store approved the app through the Worker (/nrs/install); the Worker keeps and refreshes the token.
          NRS_TOKEN_URL: ${{ vars.NRS_TOKEN_URL || 'https://brbr-murray.munatsialwyn26.workers.dev/nrs/token' }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_LOCATION_ID: ${{ secrets.SHOPIFY_LOCATION_ID }}
          NRS_AUTH_PATH: ${{ secrets.NRS_AUTH_PATH }}
          NRS_STORE_ID: ${{ secrets.NRS_STORE_ID }}
          NRS_GROUP_ID: ${{ secrets.NRS_GROUP_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_ASSIGNEE: ${{ vars.NOTIFY_ASSIGNEE || github.repository_owner }}
          REPORT_DIR: report
        run: python sync_inventory.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sync-report-${{ github.run_id }}
          path: report/
          retention-days: 14
          if-no-files-found: ignore
